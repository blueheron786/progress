<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mwmbl Progress</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 2rem; }
    .last-updated { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    .total {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .total .percentage { font-size: 3rem; font-weight: 700; color: #2563eb; }
    .total .label { color: #666; margin-top: 0.5rem; }
    .category {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .category-header {
      background: #f5f5f5;
      padding: 1rem 1.5rem;
      font-weight: 600;
      border-bottom: 1px solid #e0e0e0;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem 1.5rem; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { background: #fafafa; font-weight: 600; color: #333; font-size: 0.9rem; }
    td { font-size: 0.95rem; }
    tr:last-child td { border-bottom: none; }
    .metric-name { font-weight: 500; }
    .metric-value { font-family: monospace; color: #2563eb; }
    .metric-goal { color: #888; font-size: 0.85rem; }
    .metric-points { font-weight: 600; color: #16a34a; }
    .category-total { background: #fafafa; font-weight: 600; }
    .category-total td { border-top: 2px solid #e0e0e0; }
    .loading { text-align: center; padding: 3rem; color: #666; }
    .error { text-align: center; padding: 3rem; color: #dc2626; }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      transition: width 0.3s ease;
    }
    .note { font-size: 0.85rem; color: #888; margin-top: 1rem; }
    .hardcoded { opacity: 0.6; }
    .hardcoded::after { content: " (manual)"; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>Mwmbl Progress</h1>
  <p class="subtitle">Tracking progress towards becoming the best search engine in the world</p>
  <p class="last-updated" id="lastUpdated">Loading...</p>

  <div class="total">
    <div class="percentage" id="totalPercentage">—</div>
    <div class="label">
      <span id="totalCurrent">—</span> / <span id="totalMax">—</span> points
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="totalProgressBar" style="width: 0%"></div>
    </div>
  </div>

  <div id="categories"></div>

  <p class="note">
    Metrics updated daily via GitHub Actions. 
    <span class="hardcoded">Hardcoded values</span> are post-MVP automation targets.
  </p>

  <script src="app.js"></script>
</body>
</html>
